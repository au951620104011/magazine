<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Inimai Matrimony</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script><script src="firebase-config.js"></script><script src="app.js"></script></head><body>
<main class="wrap"><div class="auth"><div class="side"><h2>Find your life partner</h2><ul><li>Free profile</li><li>Matches picked for you</li><li>Send and receive interests</li><li>Verified by our team</li></ul></div>
<div class="main"><h2>Create your profile</h2><form id="f" class="fg"><div class="full"><label>Full name</label><input name="name" required minlength="2" maxlength="60" autocomplete="name"></div><div><label>Profile for</label><select name="gender" id="g"><option value="Groom">Groom (male)</option><option value="Bride">Bride (female)</option></select></div><div><label>Age</label><input name="age" id="age" type="number" min="21" max="60" required><p class="hint" id="ah">Groom: 21 or above</p></div><div><label>Religion</label><select name="religion"><option>Hindu</option><option>Christian</option><option>Muslim</option></select></div><div><label>Community</label><select name="caste" id="c"></select></div><div><label>Job</label><input name="job" maxlength="60"></div><div><label>City</label><input name="city" maxlength="60"></div>
<div class="full"><label>Mobile number (10 digits)</label><input name="phone" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" title="10 digit mobile number starting with 6, 7, 8 or 9" placeholder="9876543210" required autocomplete="tel"></div>
<div class="full"><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
<div><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required autocomplete="new-password"></div><div><label>Confirm password</label><input name="password2" type="password" minlength="6" required autocomplete="new-password"></div>
<label class="full" style="display:flex;gap:10px;align-items:flex-start;color:var(--ink)"><input type="checkbox" required style="width:20px;min-height:20px;margin-top:3px"> I confirm the details are true and I agree to the terms.</label>
<div class="full"><button class="btn" style="width:100%">Create profile</button></div><p id="e" class="err full"></p><p class="full" style="margin:0">Already registered? <a href="login.html">Log in</a></p></form></div></div></main>
<script>layout();$('#c').innerHTML=opts(CASTES);
$('#g').onchange=()=>{const b=$('#g').value==='Bride';$('#age').min=b?18:21;$('#ah').textContent=b?'Bride: 18 or above':'Groom: 21 or above'};
$('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.password!==d.password2)return $('#e').textContent='The two passwords do not match.';$('#e').textContent='';const r=await api('register',d);if(r.error)$('#e').textContent=r.error;else location='dashboard.html'}</script></body></html>
